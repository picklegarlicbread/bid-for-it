<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Bid For It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>
<style>
  :root{
    --pink:#F5B8CC; --red:#E2481D; --amber:#E8A83C; --cream:#F2E3DA;
    --warmwhite:#FCF6EE; --lightblue:#AAD0F0; --blue:#3D72E0; --green:#3F8F65;
    --lightgreen:#A8DDBE; --ink:#2B241F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--warmwhite);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;padding:16px 16px 40px;}

  /* ---- wavy colour zone (hand-drawn banner caps + solid fill) ---- */
  .zone{ margin:0 -16px 0; --zc: var(--lightblue); }
  .zone-cap{ display:block; width:100%; height:auto; transition:filter .2s ease; }
  .zone-cap-top{ margin-bottom:-1px; }
  .zone-cap-bottom{ margin-top:-1px; }
  .zone-fill{ background:var(--zc); padding:16px; transition:background .2s ease; }
  .zone.tint-blue{ --zc: var(--lightblue); }
  .zone.tint-blue .zone-cap{ filter:none; }
  .zone.tint-green{ --zc: #8FDCB0; }
  .zone.tint-green .zone-cap{ filter:hue-rotate(-64deg) saturate(1.35); }
  .zone.tint-red{ --zc: var(--red); }
  .zone.tint-red .zone-cap{ filter:hue-rotate(160deg) saturate(2.4) brightness(0.92); }
  .zone.tint-amber{ --zc: var(--amber); }
  .zone.tint-amber .zone-cap{ filter:hue-rotate(-172deg) saturate(2.2) brightness(1.08); }

  .doodle{
    background:var(--warmwhite);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:16px 18px;
    position:relative;
  }
  .doodle + .doodle{margin-top:16px;}
  .tilt-l{transform:rotate(-1.2deg);}
  .tilt-r{transform:rotate(1deg);}

  h1.brand{
    font-family:'Bungee',sans-serif;font-size:1.6rem;text-align:center;
    color:var(--ink);margin:6px 0 2px;
  }
  .sub{text-align:center;color:var(--ink);opacity:0.65;font-size:0.85rem;margin-bottom:20px;font-family:'Shantell Sans',cursive;}

  label{display:block;font-size:0.85rem;color:var(--ink);opacity:0.75;margin:12px 0 6px;font-weight:600;}
  input[type=text],input[type=number],input[type=password]{
    width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--ink);
    background:#fff;color:var(--ink);font-size:20px;font-family:inherit;
  }
  input::placeholder{color:#b3a99e;}

  button{
    font-family:'Bungee',sans-serif;
    border:3px solid var(--ink);border-radius:14px;
    padding:16px 20px;font-size:25px;letter-spacing:0.5px;
    cursor:pointer;width:100%;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .06s ease, box-shadow .06s ease;
    background:#fff;color:var(--ink);
  }
  button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  button:disabled{opacity:0.4;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink);}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-outline{background:#fff;color:var(--ink);}
  .btn-small{font-size:13px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);width:auto;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .row-btns{display:flex;gap:10px;margin-top:14px;}
  .row-btns>button{margin:0;}

  .code-display{
    font-family:'Bungee',sans-serif;font-size:2.2rem;letter-spacing:6px;
    text-align:center;color:var(--ink);margin:8px 0;
  }
  .pill{
    display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:20px;
    padding:5px 14px;font-size:0.78rem;font-weight:700;margin:2px 4px 2px 0;
  }

  .budget-row{display:flex;justify-content:space-between;align-items:center;}
  .budget-pill{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
  .budget-pill.mine{background:var(--lightgreen);}
  .budget-pill.theirs{background:var(--amber);}

  .criterion{
    font-family:'Shantell Sans',cursive;font-size:0.9rem;color:var(--ink);opacity:0.85;
    text-align:center;margin:10px 0 0;
  }

  .item-count-label{text-align:center;font-family:'Bungee',sans-serif;font-size:18px;color:var(--ink);opacity:0.6;margin-bottom:6px;letter-spacing:1px;}
  .item-title{
    font-family:'Bungee',sans-serif;font-size:43px;text-align:center;line-height:1.05;
    margin:0;position:relative;
  }
  .item-desc{
    font-family:'Shantell Sans',cursive;font-size:15px;text-align:center;color:var(--ink);
    opacity:0.7;margin-top:8px;line-height:1.4;
  }
  .item-title.struck{position:relative;color:#8a8177;}
  .item-title.struck::after{
    content:'';position:absolute;left:-4%;right:-4%;top:50%;height:4px;background:var(--red);
    transform:rotate(-4deg);border-radius:4px;
  }

  .chip-row{display:flex;gap:8px;margin:14px 0 10px;}
  .chip{
    flex:1;border:2.5px solid var(--ink);border-radius:16px;padding:12px 0;text-align:center;
    font-family:'Bungee',sans-serif;font-size:21px;background:#fff;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
  }
  .chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .chip.disabled{opacity:0.35;pointer-events:none;box-shadow:none;}

  .stamp{
    font-family:'Bungee',sans-serif;font-size:2.4rem;text-align:center;color:#fff;
    -webkit-text-stroke:3px var(--ink); text-stroke:3px var(--ink);
    margin:10px 0;line-height:1;
  }
  .stamp-sub{font-family:'Bungee',sans-serif;font-size:1.1rem;text-align:center;color:var(--ink);margin-top:-4px;}

  .lottie-box{width:90px;height:90px;margin:0 auto;}
  .lottie-box.small{width:56px;height:56px;}

  .waiting{text-align:center;color:var(--ink);opacity:0.7;padding:10px 0;font-family:'Shantell Sans',cursive;font-size:0.95rem;}
  .error-text{color:var(--red);font-size:0.85rem;margin-top:8px;text-align:center;font-weight:700;}
  .hint{color:var(--ink);opacity:0.55;font-size:0.75rem;text-align:center;margin-top:6px;}

  .collections-toggle{
    text-align:center;font-family:'Bungee',sans-serif;font-size:16px;color:var(--ink);
    opacity:0.6;margin:14px 0 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .collections-toggle img{width:12px;height:auto;transition:transform .15s ease;}
  .collections-toggle img.flipped{transform:rotate(180deg);}
  .icon-inline{width:16px;height:auto;margin-right:6px;vertical-align:-3px;}
  .collections{display:none;}
  .collections.open{display:block;}
  .won-list{list-style:none;padding:0;margin:0;font-size:14px;}
  .won-list li{padding:3px 0;color:var(--ink);opacity:0.75;}
  .won-list li b{opacity:1;}
  .section-label{font-family:'Bungee',sans-serif;font-size:0.8rem;margin-bottom:6px;}

  .free-tag-wrap{display:flex;justify-content:center;}

  .verdict-box{font-family:'Shantell Sans',cursive;font-size:1.05rem;line-height:1.5;margin:10px 0;}
  .score-row{display:flex;justify-content:space-around;margin:14px 0;text-align:center;}
  .score-num{font-family:'Bungee',sans-serif;font-size:2rem;}
  .lb-row{display:flex;justify-content:space-between;padding:5px 0;font-size:0.9rem;font-weight:600;}

  .center{text-align:center;}
  .link-btn{background:none;border:none;box-shadow:none;color:var(--ink);opacity:0.6;text-decoration:underline;font-family:inherit;font-size:0.8rem;cursor:pointer;padding:6px;width:auto;margin:10px auto 0;display:block;}
  footer{text-align:center;color:var(--ink);opacity:0.35;font-size:0.68rem;margin:24px 0 8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="brand">BID FOR IT</h1>
  <div class="sub">bid. bluff. get judged.</div>
  <div class="zone tint-blue" id="zone">
    <img class="zone-cap zone-cap-top" src="assets/banner-top.svg" alt="">
    <div class="zone-fill"><div id="app"></div></div>
    <img class="zone-cap zone-cap-bottom" src="assets/banner-bottom.svg" alt="">
  </div>
  <footer>syncs every ~1.6s &middot; two players, two phones</footer>
</div>

<script>
/* ============================== CONFIG ============================== */
const FIREBASE_URL = "https://bid-for-it-58699-default-rtdb.europe-west1.firebasedatabase.app/";
const ICONS_BASE = "icons/"; // relative folder alongside this file

/* ============================== CATEGORIES ============================== */
// desc fields are lorem ipsum placeholders — swap for real flavour text later.
const LOREM = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod.";
function withDesc(items){ return items.map(name => ({name, desc: LOREM})); }

const CATEGORIES = [
  {
    name: "Build Your Own Country",
    criterion: "Which country would be the best overall place to live for an ordinary person over the next 30 years, balancing prosperity, safety, health, opportunity and quality of life.",
    items: withDesc([
      "Complete energy independence","Universal healthcare","World-leading education",
      "Exceptionally low crime","World-class infrastructure","Four-day week, high wages",
      "Affordable housing for all","Rock-solid economic stability","Climate resilience & green space",
      "Low corruption, high trust"
    ])
  },
  {
    name: "Build the Perfect Roast Dinner",
    criterion: "Which roast dinner would you actually rather sit down and eat right now, judged purely on taste, comfort and how good the leftovers would be.",
    items: withDesc([
      "Perfectly crispy roast potatoes","Rich, glossy gravy","Melt-in-the-mouth roast beef",
      "Golden Yorkshire Puddings","Honey-glazed carrots & parsnips","Proper sage & onion stuffing",
      "Crispy pigs in blankets","Buttery garlic green beans","Cauliflower cheese","Sticky toffee pudding"
    ])
  },
  {
    name: "Desert Island Survival",
    criterion: "Which survivor is best equipped to actually survive and eventually get rescued from a remote desert island, balancing food, safety, sanity and realistic long-term odds.",
    items: withDesc([
      "A reliable source of fresh water","A sturdy knife","Waterproof fire-starting kit",
      "A satellite rescue beacon","Comprehensive first aid kit","Fishing gear & line",
      "A solar-powered radio","Sturdy rope, 50 metres","A calm friend who does not panic",
      "Basic wilderness survival knowledge"
    ])
  },
  {
    name: "Build the Ultimate Biscuit Tin",
    criterion: "Which biscuit tin would you actually rather have next to your tea, judged on variety, dunkability and how fast it would disappear.",
    items: withDesc([
      "Chocolate digestives","Custard creams","Jammie Dodgers","Hobnobs","Bourbons",
      "Party rings","Rich tea","Jaffa cakes","Pink wafers","Ginger nuts"
    ])
  },
  {
    name: "Build the Perfect Meal Deal",
    criterion: "Which meal deal would you actually want to eat on your lunch break, judged on taste, value and how satisfied you would feel by 3pm.",
    items: withDesc([
      "Chicken & bacon sandwich","A proper chicken wrap","Prawn mayo sandwich","A cold meal deal drink",
      "Salt & vinegar crisps","A chocolate brownie","A fruit pot","A sausage roll",
      "A protein pot","A giant cookie"
    ])
  }
];

/* ============================== FIXED RULES ============================== */
const STARTING_BUDGET = 20;
const ITEMS_PER_ROUND = 10;
const MAX_ITEMS_PER_PLAYER = 5;
const POLL_MS = 1600;
const BID_CHIPS = [1,3,5];

/* ============================== STATE ============================== */
let myRole = null, roomCode = null, room = null, pollTimer = null;
let localOverlay = null;
let collectionsOpen = false;
let liveAnimations = [];
const el = document.getElementById('app');

/* ============================== HELPERS ============================== */
function saveSession(code, role){ localStorage.setItem('bidforit_session', JSON.stringify({code, role})); }
function loadSession(){ try{ return JSON.parse(localStorage.getItem('bidforit_session')); }catch(e){ return null; } }
function clearSession(){ localStorage.removeItem('bidforit_session'); }
function otherRole(r){ return r === 'host' ? 'guest' : 'host'; }

function genCode(){
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let c = ''; for(let i=0;i<4;i++) c += letters[Math.floor(Math.random()*letters.length)];
  return c;
}

async function fbGet(path){
  const res = await fetch(`${FIREBASE_URL}/${path}.json`);
  if(!res.ok) throw new Error('Firebase GET failed: '+res.status);
  return res.json();
}
async function fbPut(path, data){
  const res = await fetch(`${FIREBASE_URL}/${path}.json`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
  if(!res.ok) throw new Error('Firebase PUT failed: '+res.status);
  return res.json();
}
async function fbPatch(path, data){
  const res = await fetch(`${FIREBASE_URL}/${path}.json`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
  if(!res.ok) throw new Error('Firebase PATCH failed: '+res.status);
  return res.json();
}

function pickCategory(avoidNames){
  let pool = CATEGORIES.filter(c => !avoidNames.includes(c.name));
  if(pool.length === 0) pool = CATEGORIES;
  return pool[Math.floor(Math.random()*pool.length)];
}

function freshRoundState(category, usedCategories){
  return {
    category, usedCategories, itemIndex: 0,
    budgets: { host: STARTING_BUDGET, guest: STARTING_BUDGET },
    won: { host: [], guest: [] },
    bids: { host: false, guest: false },
    auction: null,     // {leader, amount, trailing} once initial bids resolve to a non-tie
    pending: null,     // {type:'tie'|'final'|'takeleave', ...}
    verdict: null,
    status: 'active'
  };
}

/* ============================== LOTTIE ============================== */
function clearAnimations(){
  liveAnimations.forEach(a => { try{ a.destroy(); }catch(e){} });
  liveAnimations = [];
}
function playIcon(containerId, file, {loop=false}={}){
  const node = document.getElementById(containerId);
  if(!node || typeof lottie === 'undefined') return;
  try{
    const anim = lottie.loadAnimation({
      container: node, renderer:'svg', loop, autoplay:true,
      path: ICONS_BASE + file
    });
    liveAnimations.push(anim);
  }catch(e){ console.warn('lottie load failed', e); }
}

/* ============================== NETWORK / POLLING ============================== */
async function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  await refresh();
  pollTimer = setInterval(refresh, POLL_MS);
}
async function refresh(){
  try{
    const data = await fbGet(`rooms/${roomCode}`);
    if(data){ room = data; localOverlay = null; render(); maybeHostAdvance(); }
  }catch(e){ console.error(e); }
}
function getView(){ return localOverlay ? Object.assign({}, room, localOverlay) : room; }

/* ============================== HOST-ONLY TRANSITIONS ============================== */
// Only the host device resolves the outcome of the two simultaneous initial bids,
// and only the host triggers judging. Every other action (raise/pass/take-leave)
// is written directly by whichever player's turn it is, since those turns are
// mutually exclusive and can't race.
async function maybeHostAdvance(){
  if(myRole !== 'host' || !room || !room.round) return;
  const r = room.round;
  if(r.status !== 'active') return;

  const hostCapped = r.won.host.length >= MAX_ITEMS_PER_PLAYER;
  const guestCapped = r.won.guest.length >= MAX_ITEMS_PER_PLAYER;

  if(r.itemIndex >= ITEMS_PER_ROUND || (hostCapped && guestCapped)){
    await fbPatch(`rooms/${roomCode}/round`, {status:'complete'});
    triggerJudging();
    return;
  }

  if(r.pending) return;

  // exactly one player capped -> offer take/leave (once)
  if(hostCapped !== guestCapped){
    const capped = hostCapped ? 'host' : 'guest';
    const offeredTo = otherRole(capped);
    const item = r.category.items[r.itemIndex];
    await fbPatch(`rooms/${roomCode}/round`, {pending:{type:'takeleave', item, offeredTo}});
    return;
  }

  // both initial bids in, no auction started yet -> resolve
  if(!r.auction && r.bids.host !== false && r.bids.guest !== false){
    const hb = r.bids.host, gb = r.bids.guest;
    if(hb === gb){
      await fbPatch(`rooms/${roomCode}/round`, {pending:{type:'tie', item:r.category.items[r.itemIndex]}});
    } else {
      const leader = hb > gb ? 'host' : 'guest';
      const trailing = otherRole(leader);
      const amount = leader === 'host' ? hb : gb;
      await fbPatch(`rooms/${roomCode}/round`, {auction:{leader, amount, trailing}});
    }
  }
}

async function triggerJudging(){
  const check = await fbGet(`rooms/${roomCode}/round/judgingLock`);
  if(check) return;
  await fbPatch(`rooms/${roomCode}/round`, {judgingLock:true, status:'judging'});
  try{
    const verdict = await callClaudeJudge(room.round.category, room.round.won);
    await fbPatch(`rooms/${roomCode}/round`, {verdict, status:'judged'});
    const lb = room.leaderboard || {hostWins:0, guestWins:0, voids:0, rounds:[]};
    if(verdict.winner === 'host') lb.hostWins++;
    else if(verdict.winner === 'guest') lb.guestWins++;
    lb.rounds = (lb.rounds||[]).concat([{category: room.round.category.name, winner: verdict.winner, ts: Date.now()}]);
    await fbPatch(`rooms/${roomCode}`, {leaderboard: lb});
  }catch(e){
    await fbPatch(`rooms/${roomCode}/round`, {status:'judge_error', judgeError: String(e.message||e)});
  }
}

/* ============================== CLAUDE JUDGE CALL ============================== */
async function callClaudeJudge(category, won){
  const key = localStorage.getItem('bidforit_claude_key');
  if(!key) throw new Error('No Claude API key saved on this device');
  const hostItems = won.host.map(w=>w.item);
  const guestItems = won.guest.map(w=>w.item);
  const prompt = `You are a cheeky, opinionated judge for a two-player bidding party game.

Category: "${category.name}"
Judging criterion: ${category.criterion}

Player HOST collected: ${hostItems.length ? hostItems.join(', ') : '(nothing)'}
Player GUEST collected: ${guestItems.length ? guestItems.join(', ') : '(nothing)'}

Score each collection out of 100 against the criterion, decide a winner, and write a short, funny, mildly cheeky verdict (2-4 sentences, mild swearing allowed, UK tone). Respond ONLY with JSON, no markdown fences:
{"hostScore": number, "guestScore": number, "winner": "host" | "guest" | "tie", "text": "string"}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json', 'x-api-key': key,
      'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model:'claude-haiku-4-5', max_tokens:400, messages:[{role:'user', content:prompt}] })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(`Claude API error ${res.status}: ${t.slice(0,200)}`); }
  const data = await res.json();
  const raw = data.content[0].text.trim();
  const jsonStr = raw.replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(jsonStr);
}

/* ============================== ACTIONS ============================== */
async function actionCreateRoom(name){
  const code = genCode(); roomCode = code; myRole = 'host';
  const initial = { createdAt: Date.now(), players:{host:{name}, guest:null},
    leaderboard:{hostWins:0,guestWins:0,voids:0,rounds:[]}, round:null };
  await fbPut(`rooms/${code}`, initial);
  saveSession(code, 'host'); await startPolling();
}
async function actionJoinRoom(code, name){
  code = code.trim().toUpperCase();
  const existing = await fbGet(`rooms/${code}`);
  if(!existing) throw new Error("No room found with that code.");
  if(existing.players && existing.players.guest) throw new Error("That room already has two players.");
  roomCode = code; myRole = 'guest';
  await fbPatch(`rooms/${code}/players`, {guest:{name}});
  saveSession(code, 'guest'); await startPolling();
}
async function actionStartRound(){
  const avoid = room.round && room.round.usedCategories ? room.round.usedCategories.slice(-4) : [];
  const category = pickCategory(avoid);
  const usedCategories = avoid.concat([category.name]);
  const fresh = freshRoundState(category, usedCategories);
  await fbPatch(`rooms/${roomCode}`, {round: fresh});
}
async function actionSubmitBid(amount){
  localOverlay = {round: Object.assign({}, room.round, {bids: Object.assign({}, room.round.bids, {[myRole]: amount})})};
  render();
  await fbPatch(`rooms/${roomCode}/round/bids`, {[myRole]: amount});
}
async function actionRaise(amount){
  const r = room.round, auc = r.auction;
  const newLeader = myRole, newTrailing = otherRole(myRole);
  await fbPatch(`rooms/${roomCode}/round`, {auction:{leader:newLeader, amount, trailing:newTrailing}});
}
async function actionPassAuction(){
  const r = room.round, auc = r.auction;
  const won = JSON.parse(JSON.stringify(r.won));
  won[auc.leader].push({item: r.category.items[r.itemIndex], price: auc.amount});
  const budgets = Object.assign({}, r.budgets);
  budgets[auc.leader] -= auc.amount;
  await fbPatch(`rooms/${roomCode}/round`, {
    won, budgets, auction:null,
    pending:{type:'final', item:r.category.items[r.itemIndex], winner:auc.leader, amount:auc.amount}
  });
}
async function actionContinueAfterReveal(){
  const r = room.round;
  const nextIndex = r.itemIndex + 1;
  await fbPatch(`rooms/${roomCode}/round`, {itemIndex: nextIndex, bids:{host:false,guest:false}, auction:null, pending:null});
}
async function actionTakeLeaveChoice(take){
  const r = room.round;
  const item = r.category.items[r.itemIndex];
  const capped = r.won.host.length >= MAX_ITEMS_PER_PLAYER ? 'host' : 'guest';
  const offeredTo = otherRole(capped);
  const won = JSON.parse(JSON.stringify(r.won));
  if(take) won[offeredTo].push({item, price:0});
  await fbPatch(`rooms/${roomCode}/round`, {won, itemIndex: r.itemIndex+1, pending:null});
}
async function actionVoidRound(){
  const lb = room.leaderboard;
  lb.voids = (lb.voids||0)+1;
  if(lb.rounds && lb.rounds.length) lb.rounds[lb.rounds.length-1].voided = true;
  await fbPatch(`rooms/${roomCode}`, {leaderboard: lb});
  await refresh();
}
function actionLeaveGame(){
  clearSession(); if(pollTimer) clearInterval(pollTimer);
  myRole = null; roomCode = null; room = null; localOverlay = null;
  render();
}

/* ============================== RENDER ============================== */
function setBg(tint){ document.getElementById('zone').className = 'zone tint-' + tint; }

function render(){
  clearAnimations();
  const v = getView();

  if(!roomCode){ setBg('blue'); el.innerHTML = renderHome(); return; }
  if(!v){ setBg('blue'); el.innerHTML = `<div class="doodle center">Loading room&hellip;</div>`; return; }

  if(!v.players || !v.players.guest){ setBg('blue'); el.innerHTML = renderLobby(v); return; }
  if(!v.round){ setBg('blue'); el.innerHTML = renderPreRound(v); return; }

  const status = v.round.status;
  if(status === 'complete' || status === 'judging'){ setBg('blue'); el.innerHTML = renderJudging(); setTimeout(()=>playIcon('icon-judging','judging.json',{loop:true}),0); return; }
  if(status === 'judge_error'){ setBg('blue'); el.innerHTML = renderJudgeError(v); return; }
  if(status === 'judged'){ setBg('amber'); el.innerHTML = renderVerdict(v); setTimeout(()=>playIcon('icon-medal','medal.json'),0); return; }

  renderRoundScreen(v);
}

function renderHome(){
  const s = loadSession();
  return `
  <div class="doodle tilt-l">
    <div class="section-label">Host a game</div>
    <label>Your name</label>
    <input type="text" id="hostName" placeholder="e.g. Laura">
    <button class="btn-primary" onclick="handleCreate()">Create Room</button>
  </div>
  <div class="doodle tilt-r">
    <div class="section-label">Join a game</div>
    <label>Room code</label>
    <input type="text" id="joinCode" maxlength="4" placeholder="ABCD" style="text-align:center;letter-spacing:4px;">
    <label>Your name</label>
    <input type="text" id="joinName" placeholder="e.g. Sam">
    <button class="btn-primary" onclick="handleJoin()">Join Room</button>
  </div>
  ${s && s.code ? `<button class="btn-outline" style="margin-top:16px;" onclick="resumeSession()">Rejoin room ${s.code}</button>` : ''}
  <div id="homeError" class="error-text"></div>
  `;
}

function renderLobby(v){
  const iAmHost = myRole === 'host';
  return `
  <div class="doodle center">
    <div class="section-label">Room Code</div>
    <div class="code-display">${roomCode}</div>
    <div class="hint">Share this with the other player</div>
  </div>
  <div class="doodle">
    <span class="pill">Host: ${v.players.host ? v.players.host.name : '&hellip;'}</span>
    <span class="pill">Guest: ${v.players.guest ? v.players.guest.name : 'waiting&hellip;'}</span>
    <div style="margin-top:14px;">
    ${v.players.guest
      ? (iAmHost ? `<button class="btn-primary" onclick="handleStartRound()">Start Round</button>`
                 : `<div class="waiting">waiting for host to start&hellip;</div>`)
      : `<div class="waiting">waiting for a second player to join&hellip;</div>`}
    </div>
  </div>
  <button class="link-btn" onclick="actionLeaveGame()">Leave game</button>
  `;
}

function renderPreRound(v){
  return `
  <div class="doodle center">
    <div class="section-label">Ready?</div>
    ${renderLeaderboardMini(v)}
    ${myRole==='host'
      ? `<button class="btn-primary" style="margin-top:14px;" onclick="handleStartRound()">Start Round ${((v.leaderboard.rounds||[]).length)+1}</button>`
      : `<div class="waiting">waiting for host to start the round&hellip;</div>`}
  </div>`;
}

function renderLeaderboardMini(v){
  const lb = v.leaderboard || {hostWins:0,guestWins:0,voids:0};
  const hostName = v.players.host.name, guestName = v.players.guest.name;
  return `
  <div class="lb-row"><span>${hostName}</span><b>${lb.hostWins||0}</b></div>
  <div class="lb-row"><span>${guestName}</span><b>${lb.guestWins||0}</b></div>
  ${lb.voids ? `<div class="lb-row"><span>Voided</span><b>${lb.voids}</b></div>` : ''}`;
}

function renderJudging(){
  return `<div class="doodle center">
    <div class="lottie-box" id="icon-judging"></div>
    <div class="stamp-sub" style="font-family:'Shantell Sans',cursive;font-size:1.1rem;">the judge is deliberating&hellip;</div>
  </div>`;
}

function renderJudgeError(v){
  return `<div class="doodle center">
    <div class="section-label">Judging hit a snag</div>
    <div class="error-text">${v.round.judgeError || 'Unknown error'}</div>
    <div class="hint">Check the host device has a valid Claude API key saved.</div>
    ${myRole==='host' ? `<button class="btn-primary" style="margin-top:12px;" onclick="retryJudging()">Retry</button>` : ''}
  </div>`;
}

function renderVerdict(v){
  const r = v.round, verdict = r.verdict;
  const hostName = v.players.host.name, guestName = v.players.guest.name;
  const winnerName = verdict.winner==='host' ? hostName : verdict.winner==='guest' ? guestName : 'Nobody';
  return `
  <div class="doodle center">
    <div class="lottie-box small" id="icon-medal"></div>
    <div class="item-title" style="font-size:1.2rem;">${r.category.name}</div>
    <div class="verdict-box">${verdict.text}</div>
    <div class="score-row">
      <div><div class="score-num">${verdict.hostScore}</div><div class="hint">${hostName}</div></div>
      <div><div class="score-num">${verdict.guestScore}</div><div class="hint">${guestName}</div></div>
    </div>
    <div class="stamp-sub">${verdict.winner==='tie' ? "IT'S A TIE!" : `${winnerName.toUpperCase()} WINS!`}</div>
  </div>
  <div class="doodle">
    <div class="section-label">Championship</div>
    ${renderLeaderboardMini(v)}
  </div>
  <div class="row-btns">
    <button class="btn-primary" onclick="handleStartRound()">Play Again</button>
    <button class="btn-danger" onclick="handleVoid()">Void Round</button>
  </div>`;
}

function renderRoundScreen(v){
  const r = v.round;
  const hostName = v.players.host.name, guestName = v.players.guest.name;
  const myBudget = r.budgets[myRole], oppBudget = r.budgets[otherRole(myRole)];
  const oppName = myRole==='host' ? guestName : hostName;

  const header = `
    <div class="doodle">
      <div class="budget-row">
        <span class="budget-pill mine">You &pound;${myBudget}</span>
        <span class="budget-pill theirs">${oppName} &pound;${oppBudget}</span>
      </div>
    </div>`;

  let bodyHtml = '', bgColor = 'blue', iconCall = null;

  if(r.pending && r.pending.type === 'tie'){
    bodyHtml = renderItemCard(r, {struck:true}) + `
      <div class="doodle center">
        <div class="stamp" style="color:var(--ink);-webkit-text-stroke:0;">TIED!</div>
        <div class="waiting">Nobody's bothered enough &mdash; it goes unclaimed.</div>
        <button class="btn-primary" onclick="handleContinue()">Continue</button>
      </div>`;
  }
  else if(r.pending && r.pending.type === 'final'){
    const iWon = r.pending.winner === myRole;
    bgColor = iWon ? 'green' : 'red';
    bodyHtml = renderItemCard(r, {struck:!iWon}) + `
      <div class="doodle center">
        <div class="lottie-box" id="icon-outcome"></div>
        <div class="stamp">${iWon ? 'WON!' : 'LOST!'}</div>
        <div class="hint">${iWon ? `Yours for £${r.pending.amount}!` : `${oppName} got it for £${r.pending.amount}`}</div>
        <button class="btn-primary" onclick="handleContinue()">Continue</button>
      </div>`;
    iconCall = () => playIcon('icon-outcome', iWon ? 'won.json' : 'lost.json');
  }
  else if(r.pending && r.pending.type === 'takeleave'){
    const p = r.pending, iAmOffered = p.offeredTo === myRole;
    bodyHtml = renderItemCard(r) + `
      <div class="doodle center">
        <div class="free-tag-wrap"><div class="lottie-box" id="icon-free"></div></div>
        <div class="waiting">${otherRole(p.offeredTo)==='host'?hostName:guestName} hit their item limit &mdash; this one's free!</div>
        ${iAmOffered
          ? `<div class="row-btns"><button class="btn-primary" onclick="handleTakeLeave(true)"><img class="icon-inline" src="assets/check.svg" alt="">Take it</button><button class="btn-danger" onclick="handleTakeLeave(false)"><img class="icon-inline" src="assets/cross.svg" alt="">Leave it</button></div>`
          : `<div class="waiting">waiting for them to decide&hellip;</div>`}
      </div>`;
    iconCall = () => playIcon('icon-free', 'free-tag.json');
  }
  else if(r.auction){
    const auc = r.auction;
    const iAmLeader = auc.leader === myRole;
    if(iAmLeader){
      bodyHtml = renderItemCard(r) + `
        <div class="doodle center">
          <div class="lottie-box" id="icon-clock"></div>
          <div class="stamp-sub">YOU'RE LEADING!</div>
          <div class="waiting">at &pound;${auc.amount} &mdash; waiting to see if ${oppName} raises&hellip;</div>
        </div>`;
      iconCall = () => playIcon('icon-clock', 'clock.json');
    } else {
      const myBudgetNow = r.budgets[myRole];
      const chipsHtml = BID_CHIPS.map(c=>{
        const disabled = c <= auc.amount || c > myBudgetNow;
        return `<div class="chip ${disabled?'disabled':''}" onclick="${disabled?'':`handleRaiseChip(${c})`}">£${c}</div>`;
      }).join('');
      bodyHtml = renderItemCard(r) + `
        <div class="doodle center">
          <div class="lottie-box" id="icon-warning"></div>
          <div class="stamp">OUTBID!</div>
          <div class="waiting">${oppName} is ahead at &pound;${auc.amount}</div>
          <div class="chip-row">${chipsHtml}</div>
          <input type="number" id="raiseInput" min="${auc.amount+1}" max="${myBudgetNow}" placeholder="or type your own bid (must beat £${auc.amount})">
          <div class="row-btns">
            <button class="btn-primary" onclick="handleRaiseCustom(${auc.amount}, ${myBudgetNow})">Raise</button>
            <button class="btn-danger" onclick="handlePass()">Pass</button>
          </div>
          <div id="raiseError" class="error-text"></div>
        </div>`;
      iconCall = () => playIcon('icon-warning', 'warning.json');
    }
  }
  else {
    // initial bidding phase
    const myBid = r.bids[myRole];
    if(myBid !== false){
      bodyHtml = renderItemCard(r) + `<div class="doodle center"><div class="waiting">bid submitted &mdash; waiting for ${oppName}&hellip;</div></div>`;
    } else {
      const chipsHtml = BID_CHIPS.map(c=>{
        const disabled = c > myBudget;
        return `<div class="chip ${disabled?'disabled':''}" onclick="${disabled?'':`handleBidChip(${c})`}">£${c}</div>`;
      }).join('');
      bodyHtml = renderItemCard(r) + `
        <div class="doodle center">
          <div class="chip-row">${chipsHtml}</div>
          <input type="number" id="bidInput" min="0" max="${myBudget}" placeholder="or type your own bid">
          <button class="btn-primary" onclick="handleBidCustom(${myBudget})">Submit Bid</button>
          <div id="bidError" class="error-text"></div>
        </div>`;
    }
  }

  setBg(bgColor);
  el.innerHTML = header + bodyHtml + renderCollectionsToggle(v);
  if(iconCall) setTimeout(iconCall, 0);
}

function renderItemCard(r, opts={}){
  const item = r.category.items[r.itemIndex];
  return `
    <div class="doodle tilt-l" style="margin-top:16px;">
      <div class="item-count-label">item ${r.itemIndex+1}/${ITEMS_PER_ROUND}</div>
      <div class="item-title ${opts.struck?'struck':''}">${item.name}</div>
      <div class="item-desc">${item.desc}</div>
    </div>`;
}

function renderCollectionsToggle(v){
  const r = v.round;
  const hostName = v.players.host.name, guestName = v.players.guest.name;
  return `
  <div class="collections-toggle" onclick="toggleCollections()"><img src="assets/arrow-up.svg" class="${collectionsOpen ? '' : 'flipped'}" alt=""> collections so far</div>
  <div class="collections doodle ${collectionsOpen ? 'open' : ''}">
    <div class="row">
      <div>
        <div class="section-label">${hostName} (${r.won.host.length}/${MAX_ITEMS_PER_PLAYER})</div>
        <ul class="won-list">${r.won.host.map(w=>`<li><b>${w.item.name || w.item}</b>${w.price?` &mdash; £${w.price}`:''}</li>`).join('') || '<li>&mdash;</li>'}</ul>
      </div>
      <div>
        <div class="section-label">${guestName} (${r.won.guest.length}/${MAX_ITEMS_PER_PLAYER})</div>
        <ul class="won-list">${r.won.guest.map(w=>`<li><b>${w.item.name || w.item}</b>${w.price?` &mdash; £${w.price}`:''}</li>`).join('') || '<li>&mdash;</li>'}</ul>
      </div>
    </div>
  </div>`;
}
function toggleCollections(){ collectionsOpen = !collectionsOpen; render(); }

/* ============================== UI HANDLERS ============================== */
async function handleCreate(){
  const name = document.getElementById('hostName').value.trim();
  if(!name){ document.getElementById('homeError').textContent='Enter your name first.'; return; }
  try{ await actionCreateRoom(name); maybeAskForApiKey(); }
  catch(e){ document.getElementById('homeError').textContent = e.message; }
}
async function handleJoin(){
  const code = document.getElementById('joinCode').value.trim();
  const name = document.getElementById('joinName').value.trim();
  if(!code || !name){ document.getElementById('homeError').textContent='Enter a room code and your name.'; return; }
  try{ await actionJoinRoom(code, name); }
  catch(e){ document.getElementById('homeError').textContent = e.message; }
}
function resumeSession(){
  const s = loadSession(); if(!s) return;
  roomCode = s.code; myRole = s.role; startPolling();
}
async function handleStartRound(){
  await actionStartRound();
  if(myRole==='host') maybeAskForApiKey();
  await refresh();
}
function maybeAskForApiKey(){
  if(myRole!=='host') return;
  if(localStorage.getItem('bidforit_claude_key')) return;
  const key = prompt("Paste your Claude API key (saved only on this device, used to judge rounds):");
  if(key) localStorage.setItem('bidforit_claude_key', key.trim());
}
async function handleBidChip(amount){ await actionSubmitBid(amount); }
async function handleBidCustom(maxBudget){
  const input = document.getElementById('bidInput');
  const val = Number(input.value);
  const errEl = document.getElementById('bidError');
  if(isNaN(val) || val < 0){ errEl.textContent = 'Enter a valid amount.'; return; }
  if(val > maxBudget){ errEl.textContent = `You only have £${maxBudget} left.`; return; }
  errEl.textContent = '';
  await actionSubmitBid(Math.floor(val));
}
async function handleRaiseChip(amount){ await actionRaise(amount); }
async function handleRaiseCustom(currentAmount, maxBudget){
  const input = document.getElementById('raiseInput');
  const val = Number(input.value);
  const errEl = document.getElementById('raiseError');
  if(isNaN(val) || val <= currentAmount){ errEl.textContent = `Must be more than £${currentAmount}.`; return; }
  if(val > maxBudget){ errEl.textContent = `You only have £${maxBudget} left.`; return; }
  errEl.textContent = '';
  await actionRaise(Math.floor(val));
}
async function handlePass(){ await actionPassAuction(); }
async function handleContinue(){ collectionsOpen = false; await actionContinueAfterReveal(); }
async function handleTakeLeave(take){ await actionTakeLeaveChoice(take); }
async function handleVoid(){ await actionVoidRound(); }
async function retryJudging(){
  await fbPatch(`rooms/${roomCode}/round`, {judgingLock:false, status:'complete'});
  await refresh(); await triggerJudging();
}

/* ============================== INIT ============================== */
(function init(){
  if(FIREBASE_URL.indexOf('PASTE_YOUR') === 0){
    el.innerHTML = `<div class="doodle"><div class="section-label">Setup needed</div><p>Paste your Firebase Realtime Database URL into the <code>FIREBASE_URL</code> constant near the top of the script, then reload.</p></div>`;
    return;
  }
  const s = loadSession();
  if(s && s.code){ roomCode = s.code; myRole = s.role; startPolling(); }
  else { render(); }
})();
</script>
</body>
