<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Bid For It — Design Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>
<style>
  :root{
    --pink:#F5B8CC; --red:#E2481D; --amber:#E8A83C; --cream:#F2E3DA;
    --warmwhite:#FCF6EE; --lightblue:#AAD0F0; --blue:#3D72E0; --green:#3F8F65;
    --lightgreen:#A8DDBE; --ink:#2B241F;
    --bg: var(--lightblue);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
    min-height:100vh;
    transition:background 0.25s ease;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;padding:16px 16px 40px;}
  .doodle{
    background:var(--warmwhite);
    border:3px solid var(--ink);
    border-radius:18px 22px 16px 24px/20px 16px 24px 18px;
    padding:16px 18px;
    position:relative;
  }
  .doodle + .doodle{margin-top:16px;}
  .tilt-l{transform:rotate(-1.2deg);}
  .tilt-r{transform:rotate(1deg);}

  h1.brand{
    font-family:'Bungee',sans-serif;font-size:1.6rem;text-align:center;
    color:var(--ink);margin:6px 0 2px;
  }
  .sub{text-align:center;color:var(--ink);opacity:0.65;font-size:0.85rem;margin-bottom:20px;font-family:'Shantell Sans',cursive;}

  label{display:block;font-size:0.85rem;color:var(--ink);opacity:0.75;margin:12px 0 6px;font-weight:600;}
  input[type=text],input[type=number],input[type=password]{
    width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--ink);
    background:#fff;color:var(--ink);font-size:16px;font-family:inherit;
  }
  input::placeholder{color:#b3a99e;}

  button{
    font-family:'Bungee',sans-serif;
    border:3px solid var(--ink);border-radius:14px;
    padding:16px 20px;font-size:17px;letter-spacing:0.5px;
    cursor:pointer;width:100%;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .06s ease, box-shadow .06s ease;
    background:#fff;color:var(--ink);
  }
  button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  button:disabled{opacity:0.4;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink);}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-outline{background:#fff;color:var(--ink);}
  .btn-small{font-size:13px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);width:auto;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .row-btns{display:flex;gap:10px;margin-top:14px;}
  .row-btns>button{margin:0;}

  .code-display{
    font-family:'Bungee',sans-serif;font-size:2.2rem;letter-spacing:6px;
    text-align:center;color:var(--ink);margin:8px 0;
  }
  .pill{
    display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:20px;
    padding:5px 14px;font-size:0.78rem;font-weight:700;margin:2px 4px 2px 0;
  }

  .budget-row{display:flex;justify-content:space-between;align-items:center;}
  .budget-pill{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:6px 14px;font-weight:700;font-size:0.95rem;display:flex;align-items:center;gap:6px;}
  .budget-pill.mine{background:var(--lightgreen);}
  .budget-pill.theirs{background:var(--amber);}

  .criterion{
    font-family:'Shantell Sans',cursive;font-size:0.9rem;color:var(--ink);opacity:0.85;
    text-align:center;margin:10px 0 0;
  }

  .sparkle-label{text-align:center;font-family:'Bungee',sans-serif;font-size:0.7rem;color:var(--ink);opacity:0.6;margin-bottom:6px;letter-spacing:1px;}
  .item-title{
    font-family:'Bungee',sans-serif;font-size:1.6rem;text-align:center;line-height:1.15;
    margin:0;position:relative;
  }
  .item-desc{
    font-family:'Shantell Sans',cursive;font-size:0.85rem;text-align:center;color:var(--ink);
    opacity:0.7;margin-top:8px;line-height:1.4;
  }
  .item-title.struck{position:relative;color:#8a8177;}
  .item-title.struck::after{
    content:'';position:absolute;left:-4%;right:-4%;top:50%;height:4px;background:var(--red);
    transform:rotate(-4deg);border-radius:4px;
  }

  .chip-row{display:flex;gap:8px;margin:14px 0 10px;}
  .chip{
    flex:1;border:2.5px solid var(--ink);border-radius:16px;padding:12px 0;text-align:center;
    font-family:'Bungee',sans-serif;font-size:1rem;background:#fff;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
  }
  .chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .chip.disabled{opacity:0.35;pointer-events:none;box-shadow:none;}

  .stamp{
    font-family:'Bungee',sans-serif;font-size:2.4rem;text-align:center;color:#fff;
    -webkit-text-stroke:3px var(--ink); text-stroke:3px var(--ink);
    margin:10px 0;line-height:1;
  }
  .stamp-sub{font-family:'Bungee',sans-serif;font-size:1.1rem;text-align:center;color:var(--ink);margin-top:-4px;}

  .lottie-box{width:90px;height:90px;margin:0 auto;}
  .lottie-box.small{width:56px;height:56px;}

  .waiting{text-align:center;color:var(--ink);opacity:0.7;padding:10px 0;font-family:'Shantell Sans',cursive;font-size:0.95rem;}
  .error-text{color:var(--red);font-size:0.85rem;margin-top:8px;text-align:center;font-weight:700;}
  .hint{color:var(--ink);opacity:0.55;font-size:0.75rem;text-align:center;margin-top:6px;}

  .collections-toggle{
    text-align:center;font-family:'Bungee',sans-serif;font-size:0.75rem;color:var(--ink);
    opacity:0.6;margin:14px 0 4px;cursor:pointer;
  }
  .collections{display:none;}
  .collections.open{display:block;}
  .won-list{list-style:none;padding:0;margin:0;font-size:0.8rem;}
  .won-list li{padding:3px 0;color:var(--ink);opacity:0.75;}
  .won-list li b{opacity:1;}
  .section-label{font-family:'Bungee',sans-serif;font-size:0.8rem;margin-bottom:6px;}

  .free-tag-wrap{display:flex;justify-content:center;}

  .verdict-box{font-family:'Shantell Sans',cursive;font-size:1.05rem;line-height:1.5;margin:10px 0;}
  .score-row{display:flex;justify-content:space-around;margin:14px 0;text-align:center;}
  .score-num{font-family:'Bungee',sans-serif;font-size:2rem;}
  .lb-row{display:flex;justify-content:space-between;padding:5px 0;font-size:0.9rem;font-weight:600;}

  .center{text-align:center;}
  .link-btn{background:none;border:none;box-shadow:none;color:var(--ink);opacity:0.6;text-decoration:underline;font-family:inherit;font-size:0.8rem;cursor:pointer;padding:6px;width:auto;margin:10px auto 0;display:block;}
  footer{text-align:center;color:var(--ink);opacity:0.35;font-size:0.68rem;margin:24px 0 8px;}

  /* ---- preview-only switcher ---- */
  #switcher{
    position:sticky;top:0;z-index:50;display:flex;gap:6px;padding:10px;
    background:#1a1512;overflow-x:auto;
  }
  #switcher button{
    all:unset;flex:none;padding:8px 12px;border-radius:16px;font-size:0.72rem;
    font-family:-apple-system,sans-serif;font-weight:700;cursor:pointer;background:#3a2f28;color:#fff;
  }
  #switcher button.active{background:var(--amber);color:var(--ink);}
  .preview-note{
    text-align:center;font-size:0.72rem;color:var(--ink);opacity:0.55;
    margin:10px 0 -6px;font-family:-apple-system,sans-serif;
  }
</style>
</head>
<body>
<div id="switcher"></div>
<div class="wrap">
  <h1 class="brand">&#128176; BID FOR IT</h1>
  <div class="sub">bid. bluff. get judged.</div>
  <div class="preview-note">static design preview &mdash; tap around, nothing saves</div>
  <div id="app"></div>
  <footer>syncs every ~1.6s &middot; two players, two phones</footer>
</div>

<script>
/* ============================== CONFIG ============================== */
const FIREBASE_URL = "PREVIEW_MODE_NO_BACKEND";
const ICONS_BASE = "icons/";

/* ============================== CATEGORIES ============================== */
const LOREM = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod.";
function withDesc(items){ return items.map(name => ({name, desc: LOREM})); }
const CATEGORIES = [
  { name: "Build the Perfect Roast Dinner",
    criterion: "Which roast dinner would you actually rather sit down and eat right now, judged purely on taste, comfort and how good the leftovers would be.",
    items: withDesc(["Perfectly crispy roast potatoes","Rich, glossy gravy","Melt-in-the-mouth roast beef","Golden Yorkshire Puddings","Honey-glazed carrots & parsnips","Proper sage & onion stuffing","Crispy pigs in blankets","Buttery garlic green beans","Cauliflower cheese","Sticky toffee pudding"]) }
];

const STARTING_BUDGET = 20, ITEMS_PER_ROUND = 10, MAX_ITEMS_PER_PLAYER = 5, BID_CHIPS = [1,3,5];

/* ============================== STATE ============================== */
let myRole = 'host', roomCode = 'DEMO', room = null, localOverlay = null;
let collectionsOpen = false, liveAnimations = [];
const el = document.getElementById('app');

function otherRole(r){ return r === 'host' ? 'guest' : 'host'; }
function getView(){ return localOverlay ? Object.assign({}, room, localOverlay) : room; }

/* stub network calls so button clicks don't error in preview mode */
async function fbGet(){ return null; }
async function fbPut(){ return null; }
async function fbPatch(){ return null; }
async function refresh(){}
async function startPolling(){}
function saveSession(){} function loadSession(){ return null; } function clearSession(){}
async function triggerJudging(){} async function callClaudeJudge(){ return {}; }

/* ============================== LOTTIE ============================== */
function clearAnimations(){ liveAnimations.forEach(a=>{try{a.destroy();}catch(e){}}); liveAnimations=[]; }
function playIcon(containerId, file, {loop=false}={}){
  const node = document.getElementById(containerId);
  if(!node || typeof lottie === 'undefined') return;
  try{ const anim = lottie.loadAnimation({container:node, renderer:'svg', loop, autoplay:true, path: ICONS_BASE+file}); liveAnimations.push(anim); }
  catch(e){ console.warn(e); }
}

/* ============================== ACTIONS (local-only, optimistic) ============================== */
async function actionStartRound(){}
async function actionSubmitBid(amount){
  localOverlay = {round: Object.assign({}, room.round, {bids: Object.assign({}, room.round.bids, {[myRole]: amount})})};
  render();
}
async function actionRaise(amount){
  localOverlay = {round: Object.assign({}, room.round, {auction:{leader:myRole, amount, trailing:otherRole(myRole)}})};
  render();
}
async function actionPassAuction(){}
async function actionContinueAfterReveal(){}
async function actionTakeLeaveChoice(){}
async function actionVoidRound(){}
function actionLeaveGame(){}

/* ============================== RENDER (identical to real build) ============================== */
function setBg(color){ document.body.style.setProperty('--bg', color); }

function render(){
  clearAnimations();
  const v = getView();
  if(!v){ el.innerHTML = ''; return; }
  if(!v.players || !v.players.guest){ setBg('var(--lightblue)'); el.innerHTML = renderLobby(v); return; }
  if(!v.round){ setBg('var(--lightblue)'); el.innerHTML = renderPreRound(v); return; }
  const status = v.round.status;
  if(status === 'complete' || status === 'judging'){ setBg('var(--lightblue)'); el.innerHTML = renderJudging(); setTimeout(()=>playIcon('icon-judging','judging.json',{loop:true}),0); return; }
  if(status === 'judge_error'){ setBg('var(--lightblue)'); el.innerHTML = renderJudgeError(v); return; }
  if(status === 'judged'){ setBg('var(--amber)'); el.innerHTML = renderVerdict(v); setTimeout(()=>playIcon('icon-medal','medal.json'),0); return; }
  renderRoundScreen(v);
}

function renderLobby(v){
  const iAmHost = myRole === 'host';
  return `
  <div class="doodle center">
    <div class="section-label">Room Code</div>
    <div class="code-display">${roomCode}</div>
    <div class="hint">Share this with the other player</div>
  </div>
  <div class="doodle">
    <span class="pill">Host: ${v.players.host ? v.players.host.name : '&hellip;'}</span>
    <span class="pill">Guest: ${v.players.guest ? v.players.guest.name : 'waiting&hellip;'}</span>
    <div style="margin-top:14px;">
    ${v.players.guest
      ? (iAmHost ? `<button class="btn-primary">Start Round</button>` : `<div class="waiting">waiting for host to start&hellip;</div>`)
      : `<div class="waiting">waiting for a second player to join&hellip;</div>`}
    </div>
  </div>
  <button class="link-btn">Leave game</button>`;
}
function renderPreRound(v){
  return `<div class="doodle center"><div class="section-label">Ready?</div>${renderLeaderboardMini(v)}
  ${myRole==='host' ? `<button class="btn-primary" style="margin-top:14px;">Start Round ${((v.leaderboard.rounds||[]).length)+1}</button>` : `<div class="waiting">waiting for host to start the round&hellip;</div>`}</div>`;
}
function renderLeaderboardMini(v){
  const lb = v.leaderboard || {hostWins:0,guestWins:0,voids:0};
  const hostName = v.players.host.name, guestName = v.players.guest.name;
  return `<div class="lb-row"><span>&#127942; ${hostName}</span><b>${lb.hostWins||0}</b></div>
  <div class="lb-row"><span>&#127942; ${guestName}</span><b>${lb.guestWins||0}</b></div>
  ${lb.voids ? `<div class="lb-row"><span>Voided</span><b>${lb.voids}</b></div>` : ''}`;
}
function renderJudging(){
  return `<div class="doodle center"><div class="lottie-box" id="icon-judging"></div>
  <div class="stamp-sub" style="font-family:'Shantell Sans',cursive;font-size:1.1rem;">the judge is deliberating&hellip;</div></div>`;
}
function renderJudgeError(v){
  return `<div class="doodle center"><div class="section-label">Judging hit a snag</div>
  <div class="error-text">${v.round.judgeError || 'Unknown error'}</div>
  <div class="hint">Check the host device has a valid Claude API key saved.</div>
  ${myRole==='host' ? `<button class="btn-primary" style="margin-top:12px;">Retry</button>` : ''}</div>`;
}
function renderVerdict(v){
  const r = v.round, verdict = r.verdict;
  const hostName = v.players.host.name, guestName = v.players.guest.name;
  const winnerName = verdict.winner==='host' ? hostName : verdict.winner==='guest' ? guestName : 'Nobody';
  return `<div class="doodle center">
    <div class="lottie-box small" id="icon-medal"></div>
    <div class="item-title" style="font-size:1.2rem;">${r.category.name}</div>
    <div class="verdict-box">${verdict.text}</div>
    <div class="score-row"><div><div class="score-num">${verdict.hostScore}</div><div class="hint">${hostName}</div></div>
    <div><div class="score-num">${verdict.guestScore}</div><div class="hint">${guestName}</div></div></div>
    <div class="stamp-sub">${verdict.winner==='tie' ? "IT'S A TIE!" : `${winnerName.toUpperCase()} WINS!`}</div></div>
  <div class="doodle"><div class="section-label">Championship</div>${renderLeaderboardMini(v)}</div>
  <div class="row-btns"><button class="btn-primary">Play Again</button><button class="btn-danger">Void Round</button></div>`;
}
function renderRoundScreen(v){
  const r = v.round;
  const hostName = v.players.host.name, guestName = v.players.guest.name;
  const myBudget = r.budgets[myRole], oppBudget = r.budgets[otherRole(myRole)];
  const oppName = myRole==='host' ? guestName : hostName;
  const header = `<div class="doodle"><div class="budget-row">
    <span class="budget-pill mine">You &pound;${myBudget}</span>
    <span class="budget-pill theirs">${oppName} &pound;${oppBudget}</span></div></div>`;
  let bodyHtml = '', bgColor = 'var(--lightblue)', iconCall = null;

  if(r.pending && r.pending.type === 'tie'){
    bodyHtml = renderItemCard(r, {struck:true}) + `<div class="doodle center">
      <div class="stamp" style="color:var(--ink);-webkit-text-stroke:0;">TIED!</div>
      <div class="waiting">Nobody's bothered enough &mdash; it goes unclaimed.</div>
      <button class="btn-primary" onclick="handleContinue()">Continue</button></div>`;
  } else if(r.pending && r.pending.type === 'final'){
    const iWon = r.pending.winner === myRole;
    bgColor = iWon ? 'var(--lightgreen)' : 'var(--red)';
    bodyHtml = renderItemCard(r, {struck:!iWon}) + `<div class="doodle center">
      <div class="lottie-box" id="icon-outcome"></div>
      <div class="stamp">${iWon ? 'WON!' : 'LOST!'}</div>
      <div class="hint">${iWon ? `Yours for £${r.pending.amount}!` : `${oppName} got it for £${r.pending.amount}`}</div>
      <button class="btn-primary" onclick="handleContinue()">Continue</button></div>`;
    iconCall = () => playIcon('icon-outcome', iWon ? 'won.json' : 'lost.json');
  } else if(r.pending && r.pending.type === 'takeleave'){
    const p = r.pending, iAmOffered = p.offeredTo === myRole;
    bodyHtml = renderItemCard(r) + `<div class="doodle center">
      <div class="free-tag-wrap"><div class="lottie-box" id="icon-free"></div></div>
      <div class="waiting">${otherRole(p.offeredTo)==='host'?hostName:guestName} hit their item limit &mdash; this one's free!</div>
      ${iAmOffered ? `<div class="row-btns"><button class="btn-primary" onclick="handleTakeLeave(true)">Take it</button><button class="btn-danger" onclick="handleTakeLeave(false)">Leave it</button></div>` : `<div class="waiting">waiting for them to decide&hellip;</div>`}</div>`;
    iconCall = () => playIcon('icon-free', 'free-tag.json');
  } else if(r.auction){
    const auc = r.auction, iAmLeader = auc.leader === myRole;
    if(iAmLeader){
      bodyHtml = renderItemCard(r) + `<div class="doodle center">
        <div class="lottie-box" id="icon-clock"></div>
        <div class="stamp-sub">YOU'RE LEADING!</div>
        <div class="waiting">at &pound;${auc.amount} &mdash; waiting to see if ${oppName} raises&hellip;</div></div>`;
      iconCall = () => playIcon('icon-clock', 'clock.json');
    } else {
      const myBudgetNow = r.budgets[myRole];
      const chipsHtml = BID_CHIPS.map(c=>{
        const disabled = c <= auc.amount || c > myBudgetNow;
        return `<div class="chip ${disabled?'disabled':''}" onclick="${disabled?'':`handleRaiseChip(${c})`}">£${c}</div>`;
      }).join('');
      bodyHtml = renderItemCard(r) + `<div class="doodle center">
        <div class="lottie-box" id="icon-warning"></div>
        <div class="stamp">OUTBID!</div>
        <div class="waiting">${oppName} is ahead at &pound;${auc.amount}</div>
        <div class="chip-row">${chipsHtml}</div>
        <input type="number" id="raiseInput" placeholder="or type your own bid (must beat £${auc.amount})">
        <div class="row-btns"><button class="btn-primary" onclick="handleRaiseChip(${auc.amount+2})">Raise</button><button class="btn-danger">Pass</button></div>
        <div id="raiseError" class="error-text"></div></div>`;
      iconCall = () => playIcon('icon-warning', 'warning.json');
    }
  } else {
    const myBid = r.bids[myRole];
    if(myBid !== null){
      bodyHtml = renderItemCard(r) + `<div class="doodle center"><div class="waiting">bid submitted &mdash; waiting for ${oppName}&hellip;</div></div>`;
    } else {
      const chipsHtml = BID_CHIPS.map(c=>{
        const disabled = c > myBudget;
        return `<div class="chip ${disabled?'disabled':''}" onclick="${disabled?'':`handleBidChip(${c})`}">£${c}</div>`;
      }).join('');
      bodyHtml = renderItemCard(r) + `<div class="doodle center">
        <div class="chip-row">${chipsHtml}</div>
        <input type="number" id="bidInput" placeholder="or type your own bid">
        <button class="btn-primary" onclick="handleBidChip(4)">Submit Bid</button>
        <div id="bidError" class="error-text"></div></div>`;
    }
  }
  setBg(bgColor);
  el.innerHTML = header + bodyHtml + renderCollectionsToggle(v);
  if(iconCall) setTimeout(iconCall, 0);
}
function renderItemCard(r, opts={}){
  const item = r.category.items[r.itemIndex];
  return `<div class="doodle tilt-l" style="margin-top:16px;">
    <div class="sparkle-label">&#10022; item ${r.itemIndex+1}/${ITEMS_PER_ROUND} &#10022;</div>
    <div class="item-title ${opts.struck?'struck':''}">${item.name}</div>
    <div class="item-desc">${item.desc}</div></div>`;
}
function renderCollectionsToggle(v){
  const r = v.round;
  const hostName = v.players.host.name, guestName = v.players.guest.name;
  return `<div class="collections-toggle" onclick="toggleCollections()">${collectionsOpen ? '&#9650;' : '&#9660;'} collections so far</div>
  <div class="collections doodle ${collectionsOpen ? 'open' : ''}"><div class="row">
    <div><div class="section-label">${hostName} (${r.won.host.length}/${MAX_ITEMS_PER_PLAYER})</div>
    <ul class="won-list">${r.won.host.map(w=>`<li><b>${w.item.name||w.item}</b>${w.price?` &mdash; £${w.price}`:''}</li>`).join('')||'<li>&mdash;</li>'}</ul></div>
    <div><div class="section-label">${guestName} (${r.won.guest.length}/${MAX_ITEMS_PER_PLAYER})</div>
    <ul class="won-list">${r.won.guest.map(w=>`<li><b>${w.item.name||w.item}</b>${w.price?` &mdash; £${w.price}`:''}</li>`).join('')||'<li>&mdash;</li>'}</ul></div>
  </div></div>`;
}
function toggleCollections(){ collectionsOpen = !collectionsOpen; render(); }
function handleBidChip(amount){ actionSubmitBid(amount); }
function handleRaiseChip(amount){ actionRaise(amount); }
function handleContinue(){}
function handleTakeLeave(){}

/* ============================== DEMO DATA ============================== */
function baseRoom(overrides){
  const category = CATEGORIES[0];
  return Object.assign({
    players: {host:{name:'Laura'}, guest:{name:'Sam'}},
    leaderboard: {hostWins:2, guestWins:1, voids:0, rounds:[{category:category.name, winner:'host'}]},
    round: {
      category, itemIndex: 3,
      budgets: {host:14, guest:17},
      won: { host:[{item:{name:'Roast potatoes'},price:6},{item:{name:'Gravy'},price:3}], guest:[{item:{name:'Roast beef'},price:3}] },
      bids: {host:null, guest:null},
      auction: null, pending: null, verdict: null, status:'active'
    }
  }, overrides);
}

const DEMOS = {
  'lobby-waiting': ()=>({ myRole:'host', room:{ players:{host:{name:'Laura'},guest:null}, leaderboard:{hostWins:0,guestWins:0,voids:0,rounds:[]}, round:null } }),
  'lobby-ready': ()=>({ myRole:'host', room:{ players:{host:{name:'Laura'},guest:{name:'Sam'}}, leaderboard:{hostWins:0,guestWins:0,voids:0,rounds:[]}, round:null } }),
  'preround': ()=>({ myRole:'host', room: baseRoom({round:null}) }),
  'bidding': ()=>({ myRole:'host', room: baseRoom({}) }),
  'bidding-waiting': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {bids:{host:6,guest:null}})}) }),
  'outbid': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {auction:{leader:'guest',amount:6,trailing:'host'}})}) }),
  'leading': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {auction:{leader:'host',amount:6,trailing:'guest'}})}) }),
  'tie': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {pending:{type:'tie', item: baseRoom().round.category.items[3]}})}) }),
  'won': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {pending:{type:'final', winner:'host', amount:7}})}) }),
  'lost': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {pending:{type:'final', winner:'guest', amount:7}})}) }),
  'take-offered': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {
    won:{host:[{item:{name:'Item'},price:1},{item:{name:'Item'},price:1},{item:{name:'Item'},price:1},{item:{name:'Item'},price:1},{item:{name:'Item'},price:1}], guest:[]},
    pending:{type:'takeleave', item: baseRoom().round.category.items[3], offeredTo:'guest'}
  })}) }),
  'judging': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {status:'judging'})}) }),
  'judge-error': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {status:'judge_error', judgeError:'Claude API error 401: invalid API key'})}) }),
  'verdict': ()=>({ myRole:'host', room: baseRoom({round: Object.assign({}, baseRoom().round, {status:'judged', verdict:{
    text:"Laura's roast is a genuinely solid effort — crispy spuds, proper stuffing, the lot. Sam's plate is basically a Sunday dinner tribute act missing half its cast. Not close.",
    hostScore:82, guestScore:54, winner:'host'
  }})}) })
};

function loadDemo(key, btn){
  document.querySelectorAll('#switcher button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const d = DEMOS[key]();
  myRole = d.myRole; room = d.room; localOverlay = null; collectionsOpen = false;
  render();
}

/* build switcher */
const switcherEl = document.getElementById('switcher');
const labels = {
  'lobby-waiting':'Lobby (waiting)', 'lobby-ready':'Lobby (ready)', 'preround':'Pre-Round',
  'bidding':'Bidding', 'bidding-waiting':'Bidding (waiting)', 'outbid':'Bid Again (Outbid)',
  'leading':'Bid Again (Leading)', 'tie':'Tied', 'won':'Reveal (Won)', 'lost':'Reveal (Lost)',
  'take-offered':'Take/Leave', 'judging':'Judging', 'judge-error':'Judge Error', 'verdict':'Verdict'
};
Object.keys(DEMOS).forEach((key,i)=>{
  const b = document.createElement('button');
  b.textContent = labels[key] || key;
  b.onclick = ()=>loadDemo(key,b);
  switcherEl.appendChild(b);
  if(i===3){ b.classList.add('active'); } // default to 'bidding'
});
loadDemo('bidding');
</script>
